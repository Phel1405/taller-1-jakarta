services:
  logic-tier:
    build:
      context: ./logic-tier/
    env_file:
      - .env
    environment:
      DATA_TIER_URL: http://data-tier:8080/jakartaee-data-tier/api
    ports:
      - "8081:8080"
    depends_on:
      data-tier:
        condition: service_started

  data-tier:
    build:
      context: ./data-tier
    env_file:
      - .env
    environment:
      PAGO_LIMITE: "1000000"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mysql:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    # max_prepared_transactions > 0 es obligatorio para que Postgres acepte
    # el PREPARE TRANSACTION que usa el protocolo XA / 2PC.
    command: ["postgres", "-c", "max_prepared_transactions=50"]
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE}"
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mysql_data:

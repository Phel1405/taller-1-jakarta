services:
  logic-tier:
    build:
      context: ./logic-tier/
    ports:
      - "8081:8080"
    depends_on:
      - data-tier

  data-tier:
    build:
      context: ./data-tier
    ports:
      - "8082:8080"
      - "50051:50051"

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "{POSTGRES_DB}"
      POSTGRES_USER: "{POSTGRES_USER}"
      POSTGRES_PASSWORD: "{POSTGRES_PASSWORD}"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:latest
    environment:
      MYSQL_DATABASE: "{MYSQL_DATABASE}"
      MYSQL_USER: "{MYSQL_USER}"
      MYSQL_PASSWORD: "{MYSQL_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "{MYSQL_ROOT_PASSWORD}"
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  postgres_data:
  mysql_data:
